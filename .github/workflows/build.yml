name: build

on:
  push:
    branches: ["**"]
  pull_request:
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref_name != github.event.repository.default_branch) }}

env:
  GOFLAGS: -buildvcs=false
  BIFROST_VERSIONS_COUNT: "4"

jobs:
  test:
    name: unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/web/package-lock.json

      - name: Build UI assets (engine.wasm, wasm_exec.js, web bundle)
        run: make assets

      - name: go vet + go test
        run: make test

      - name: Node test of the wasm engine
        run: make test-web

  resolve:
    name: resolve build matrix
    if: (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      has_work: ${{ steps.plan.outputs.has_work }}
      plugin_rev: ${{ steps.plan.outputs.plugin_rev }}
      image: ${{ steps.plan.outputs.image }}
      versions: ${{ steps.plan.outputs.versions }}
    permissions:
      contents: read
      packages: read
    steps:
      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - id: plan
        name: Select Bifrost versions and skip combinations already released
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          rev="${GITHUB_SHA:0:12}"
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/bifrost"
          # Latest stable transports/vX.Y.Z tags; pre-releases (-rc, -beta, ...) are excluded.
          mapfile -t versions < <(gh api --paginate repos/maximhq/bifrost/git/matching-refs/tags/transports/v --jq '.[].ref' \
            | sed 's|^refs/tags/transports/v||' \
            | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' \
            | sort -V | tail -n "$BIFROST_VERSIONS_COUNT")
          if [ "${#versions[@]}" -eq 0 ]; then
            echo "::error::no stable Bifrost transports/v* tag found"
            exit 1
          fi
          echo "Bifrost versions: ${versions[*]}; plugin rev $rev"
          include='[]'
          for bv in "${versions[@]}"; do
            assets="$(gh release view "bifrost-v${bv}" --json assets --jq '.assets[].name' 2>/dev/null || true)"
            for pair in "ubuntu-24.04 amd64" "ubuntu-24.04-arm arm64"; do
              read -r runner arch <<<"$pair"
              so="payload-${rev}-bifrost-v${bv}-linux-${arch}.so"
              if printf '%s\n' "$assets" | grep -qxF "$so" \
                && docker manifest inspect "${image}:v${bv}-${rev}-${arch}" >/dev/null 2>&1; then
                echo "skip: $so and its image are already published"
                continue
              fi
              latest=false
              [ "$bv" = "${versions[-1]}" ] && latest=true
              include="$(jq -c --arg bv "$bv" --arg runner "$runner" --arg arch "$arch" --argjson latest "$latest" \
                '. + [{bv: $bv, runner: $runner, arch: $arch, latest: $latest}]' <<<"$include")"
            done
          done
          echo "matrix: $include"
          {
            echo "matrix={\"include\":${include}}"
            echo "versions=$(jq -c '[.[] | {bv, latest}] | unique' <<<"$include")"
            echo "image=${image}"
            if [ "$include" = "[]" ]; then echo "has_work=false"; else echo "has_work=true"; fi
            echo "plugin_rev=${rev}"
          } >>"$GITHUB_OUTPUT"

  build:
    name: build + e2e (bifrost v${{ matrix.bv }}, linux-${{ matrix.arch }})
    needs: [test, resolve]
    if: needs.resolve.outputs.has_work == 'true'
    # Older Bifrost versions may lack APIs the plugin uses; their failures are reported
    # on the job but do not fail the run. Only the latest version is required to pass.
    continue-on-error: ${{ !matrix.latest }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.resolve.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
      packages: write
    env:
      BV: ${{ matrix.bv }}
      REV: ${{ needs.resolve.outputs.plugin_rev }}
      IMAGE: ${{ needs.resolve.outputs.image }}
      ARCH: ${{ matrix.arch }}
      BUILD_DIR: ${{ github.workspace }}/build
      OUT_DIR: ${{ github.workspace }}/build/out
    steps:
      - uses: actions/checkout@v4
        with:
          path: plugin

      - name: Download Bifrost transports/v${{ env.BV }}
        run: |
          mkdir -p bifrost
          curl -fsSL --retry 3 "https://codeload.github.com/maximhq/bifrost/tar.gz/refs/tags/transports/v${BV}" \
            | tar -xz --strip-components=1 -C bifrost
          test -f bifrost/transports/go.mod
          echo "transports go directive: $(grep -E '^go ' bifrost/transports/go.mod)"

      - uses: actions/setup-go@v5
        with:
          go-version-file: bifrost/transports/go.mod
          cache-dependency-path: |
            plugin/go.sum
            bifrost/transports/go.sum

      # Node 22 latest: ui/web needs >= 22.18, newer than Bifrost's .nvmrc (22.12.0);
      # the Bifrost dashboard builds fine with it.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            bifrost/ui/package-lock.json
            plugin/ui/web/package-lock.json

      # The core version is always taken from bifrost/transports/go.mod of the selected
      # tag (transports/v2.3.1 pins bifrost/core v1.13.0, not v1.12.0 as an earlier plan
      # assumed); the pin in the plugin's go.mod is only a development default.
      - name: Pin bifrost/core to the version transports requires
        working-directory: plugin
        run: |
          make sync-core BIFROST_DIR=../bifrost
          grep 'maximhq/bifrost/core' go.mod

      - name: Create go.work (bifrost/transports + plugin)
        working-directory: plugin
        run: |
          make work BIFROST_DIR=../bifrost
          echo "GOWORK=${BUILD_DIR}/go.work" >>"$GITHUB_ENV"

      - name: Download modules (records go.work.sum)
        working-directory: plugin
        run: go mod download

      - name: Build the Bifrost dashboard
        working-directory: plugin
        run: make bifrost-ui BIFROST_DIR=../bifrost

      - name: Build UI assets (engine.wasm, wasm_exec.js, web bundle)
        working-directory: plugin
        run: make assets

      - name: go vet + go test against this Bifrost version
        working-directory: plugin
        run: make test

      - name: Node test of the wasm engine
        working-directory: plugin
        run: make test-web

      - name: Build bifrost-http (dynamic) and payload.so
        working-directory: plugin
        run: |
          make bifrost-http so BIFROST_DIR=../bifrost BIFROST_VERSION="$BV"
          go version
          file "$OUT_DIR/bifrost-http" "$OUT_DIR/payload.so"

      - name: Ensure jq
        run: command -v jq || { sudo apt-get update && sudo apt-get install -y jq; }

      - name: End-to-end test
        working-directory: plugin
        env:
          E2E_WORKDIR: ${{ runner.temp }}/payload-e2e
        run: make e2e

      - name: Upload e2e logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-logs-bifrost-v${{ matrix.bv }}-linux-${{ matrix.arch }}
          path: ${{ runner.temp }}/payload-e2e
          if-no-files-found: ignore
          retention-days: 7

      - name: Package
        run: |
          mkdir -p dist
          host="bifrost-http-v${BV}-${REV}-linux-${ARCH}"
          so="payload-${REV}-bifrost-v${BV}-linux-${ARCH}.so"
          sums="SHA256SUMS-${REV}-linux-${ARCH}.txt"
          cp "$OUT_DIR/bifrost-http" "dist/$host"
          cp "$OUT_DIR/payload.so" "dist/$so"
          chmod +x "dist/$host"
          (cd dist && sha256sum "$host" "$so" >"$sums")
          cat "dist/$sums"

      - name: Publish to release bifrost-v${{ env.BV }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="bifrost-v${BV}"
          notes="$(printf '%s\n' \
            "Built automatically against Bifrost transports/v${BV}." \
            "" \
            "Asset names carry the plugin commit they were built from; the newest commit replaces older assets for the same architecture." \
            "" \
            "Go plugins only load into a host built from the same source tree and toolchain:" \
            "run the bifrost-http binary from this release together with the matching payload .so" \
            "(official Bifrost release binaries are statically linked and cannot load plugins).")"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            # The amd64 and arm64 jobs may race to create the release; the loser just reuses it.
            gh release create "$tag" --target "$GITHUB_SHA" --title "Bifrost v${BV}" --notes "$notes" \
              || gh release view "$tag" >/dev/null
          fi
          gh release upload "$tag" dist/* --clobber
          # Drop assets of this architecture built from older plugin commits.
          gh release view "$tag" --json assets --jq '.assets[].name' \
            | { grep -E -- "-linux-${ARCH}(\.so|\.txt)?$" || true; } \
            | { grep -vF -- "$REV" || true; } \
            | while read -r old; do gh release delete-asset "$tag" "$old" --yes; done

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # Per-architecture image, built natively on this runner; the manifest job
      # combines the architectures into multi-arch tags.
      - name: Build and push image ${{ env.IMAGE }}:v${{ env.BV }}-${{ env.REV }}-${{ env.ARCH }}
        run: |
          set -euo pipefail
          ctx="${RUNNER_TEMP}/image"
          rm -rf "$ctx" && mkdir -p "$ctx"
          cp "$OUT_DIR/bifrost-http" "$ctx/bifrost-http"
          cp "$OUT_DIR/payload.so" "$ctx/payload.so"
          cp bifrost/transports/docker-entrypoint.sh "$ctx/docker-entrypoint.sh"
          tag="${IMAGE}:v${BV}-${REV}-${ARCH}"
          docker build -f plugin/docker/Dockerfile \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.version=v${BV}-${REV}" \
            -t "$tag" "$ctx"
          docker push "$tag"

  manifest:
    name: image manifest (bifrost v${{ matrix.bv }})
    needs: [resolve, build]
    if: ${{ !cancelled() && needs.resolve.outputs.has_work == 'true' }}
    continue-on-error: ${{ !matrix.latest }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.resolve.outputs.versions) }}
    runs-on: ubuntu-24.04
    permissions:
      packages: write
    env:
      BV: ${{ matrix.bv }}
      REV: ${{ needs.resolve.outputs.plugin_rev }}
      IMAGE: ${{ needs.resolve.outputs.image }}
      LATEST: ${{ matrix.latest }}
    steps:
      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - uses: docker/setup-buildx-action@v3

      - name: Create multi-arch tags
        run: |
          set -euo pipefail
          sources=()
          for arch in amd64 arm64; do
            src="${IMAGE}:v${BV}-${REV}-${arch}"
            if docker manifest inspect "$src" >/dev/null 2>&1; then
              sources+=("$src")
            else
              echo "::warning::$src not found; it is left out of the multi-arch tags"
            fi
          done
          if [ "${#sources[@]}" -eq 0 ]; then
            echo "::error::no image was built for Bifrost v${BV}"
            exit 1
          fi
          tags=(-t "${IMAGE}:v${BV}-${REV}" -t "${IMAGE}:v${BV}")
          if [ "$LATEST" = "true" ]; then tags+=(-t "${IMAGE}:latest"); fi
          docker buildx imagetools create "${tags[@]}" "${sources[@]}"
          docker buildx imagetools inspect "${IMAGE}:v${BV}-${REV}"
