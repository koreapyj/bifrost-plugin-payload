name: build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      bifrost_version:
        description: "Bifrost transports version to build against (e.g. 2.3.1, v2.3.1 or transports/v2.3.1). Empty selects the latest stable transports/v* tag."
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  GOFLAGS: -buildvcs=false

jobs:
  test:
    name: unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/web/package-lock.json

      - name: Build UI assets (engine.wasm, wasm_exec.js, web bundle)
        run: make assets

      - name: go vet + go test
        run: make test

      - name: Node test of the wasm engine
        run: make test-web

  resolve:
    name: resolve versions
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    outputs:
      bifrost_version: ${{ steps.versions.outputs.bifrost_version }}
      plugin_version: ${{ steps.versions.outputs.plugin_version }}
    steps:
      - id: versions
        name: Resolve Bifrost and plugin versions
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_BIFROST_VERSION: ${{ inputs.bifrost_version }}
        run: |
          v="${INPUT_BIFROST_VERSION:-}"
          v="${v#refs/tags/}"
          v="${v#transports/}"
          v="${v#v}"
          if [ -z "$v" ]; then
            # Latest stable transports/vX.Y.Z tag; pre-releases (-rc, -beta, -prerelease, ...) are excluded.
            v="$(gh api --paginate repos/maximhq/bifrost/git/matching-refs/tags/transports/v --jq '.[].ref' \
              | sed 's|^refs/tags/transports/v||' \
              | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' \
              | sort -V | tail -n 1)"
          fi
          if ! printf '%s' "$v" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::invalid or unresolved Bifrost version: '$v'"
            exit 1
          fi
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            pv="${GITHUB_REF_NAME#v}"
          else
            pv="0.0.0-dev.${GITHUB_SHA:0:12}"
          fi
          echo "Bifrost transports/v$v, plugin $pv"
          {
            echo "bifrost_version=$v"
            echo "plugin_version=$pv"
          } >>"$GITHUB_OUTPUT"

  build:
    name: build + e2e (linux-${{ matrix.arch }})
    needs: [test, resolve]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    env:
      BV: ${{ needs.resolve.outputs.bifrost_version }}
      PV: ${{ needs.resolve.outputs.plugin_version }}
      ARCH: ${{ matrix.arch }}
      BUILD_DIR: ${{ github.workspace }}/build
      OUT_DIR: ${{ github.workspace }}/build/out
    steps:
      - uses: actions/checkout@v4
        with:
          path: plugin

      - name: Download Bifrost transports/v${{ env.BV }}
        run: |
          mkdir -p bifrost
          curl -fsSL --retry 3 "https://codeload.github.com/maximhq/bifrost/tar.gz/refs/tags/transports/v${BV}" \
            | tar -xz --strip-components=1 -C bifrost
          test -f bifrost/transports/go.mod
          echo "transports go directive: $(grep -E '^go ' bifrost/transports/go.mod)"

      - uses: actions/setup-go@v5
        with:
          go-version-file: bifrost/transports/go.mod
          cache-dependency-path: |
            plugin/go.sum
            bifrost/transports/go.sum

      # Node 22 latest: ui/web needs >= 22.18, newer than Bifrost's .nvmrc (22.12.0);
      # the Bifrost dashboard builds fine with it.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            bifrost/ui/package-lock.json
            plugin/ui/web/package-lock.json

      # The core version is always taken from bifrost/transports/go.mod of the selected
      # tag (transports/v2.3.1 pins bifrost/core v1.13.0, not v1.12.0 as an earlier plan
      # assumed); the pin in the plugin's go.mod is only a development default.
      - name: Pin bifrost/core to the version transports requires
        working-directory: plugin
        run: |
          make sync-core BIFROST_DIR=../bifrost
          grep 'maximhq/bifrost/core' go.mod

      - name: Create go.work (bifrost/transports + plugin)
        working-directory: plugin
        run: |
          make work BIFROST_DIR=../bifrost
          echo "GOWORK=${BUILD_DIR}/go.work" >>"$GITHUB_ENV"

      - name: Download modules (records go.work.sum)
        working-directory: plugin
        run: go mod download

      - name: Build the Bifrost dashboard
        working-directory: plugin
        run: make bifrost-ui BIFROST_DIR=../bifrost

      - name: Build UI assets (engine.wasm, wasm_exec.js, web bundle)
        working-directory: plugin
        run: make assets

      - name: go vet + go test against this Bifrost version
        working-directory: plugin
        run: make test

      - name: Node test of the wasm engine
        working-directory: plugin
        run: make test-web

      - name: Build bifrost-http (dynamic) and payload.so
        working-directory: plugin
        run: |
          make bifrost-http so BIFROST_DIR=../bifrost BIFROST_VERSION="$BV"
          go version
          file "$OUT_DIR/bifrost-http" "$OUT_DIR/payload.so"

      - name: Ensure jq
        run: command -v jq || { sudo apt-get update && sudo apt-get install -y jq; }

      - name: End-to-end test
        working-directory: plugin
        env:
          E2E_WORKDIR: ${{ runner.temp }}/payload-e2e
        run: make e2e

      - name: Upload e2e logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-logs-linux-${{ matrix.arch }}
          path: ${{ runner.temp }}/payload-e2e
          if-no-files-found: ignore
          retention-days: 7

      - name: Package
        run: |
          mkdir -p dist
          host="bifrost-http-v${BV}-linux-${ARCH}"
          so="payload-v${PV}-bifrost-v${BV}-linux-${ARCH}.so"
          cp "$OUT_DIR/bifrost-http" "dist/$host"
          cp "$OUT_DIR/payload.so" "dist/$so"
          chmod +x "dist/$host"
          (cd dist && sha256sum "$host" "$so" >"SHA256SUMS-linux-${ARCH}.txt")
          cat "dist/SHA256SUMS-linux-${ARCH}.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: payload-linux-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  release:
    name: release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [resolve, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: payload-linux-*
          path: dist
          merge-multiple: true

      - name: Release notes
        env:
          BV: ${{ needs.resolve.outputs.bifrost_version }}
        run: |
          cat >notes.md <<EOF
          Built against Bifrost transports/v${BV}.

          Go plugins only load into a host built from the same source tree and toolchain:
          run the bifrost-http binary from this release together with the matching payload .so
          (official Bifrost release binaries are statically linked and cannot load plugins).
          EOF

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body_path: notes.md
          fail_on_unmatched_files: true
